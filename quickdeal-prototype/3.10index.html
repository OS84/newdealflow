<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuickDeal · New deal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!--
    QuickDeal v3 — single-page vertical wizard
    Flow: Customer → Location → Deal type (parent + subtype) → Vehicle → Submit
    Synthetic data shaped after Tower's real distributions.
  -->

  <style>
    :root {
      /* palette */
      --bg: #fafbfc;
      --surface: #ffffff;
      --surface-2: #f7f8fa;
      --surface-3: #f1f3f6;
      --border: #e8eaed;
      --border-strong: #d4d7dc;
      --border-active: #5e6ad2;
      --text: #0f1419;
      --text-soft: #404550;
      --text-muted: #6b7280;
      --text-faint: #9aa0aa;
      --primary: #5e6ad2;
      --primary-hover: #4754b8;
      --primary-soft: #eef0fb;
      --primary-tint: #f6f7fd;
      --success: #137250;
      --success-soft: #ecfdf5;
      --warn: #92400e;
      --warn-soft: #fef3c7;
      --danger: #b42318;
      --danger-soft: #fee4e2;
      --accent-tlc: #0e7490;
      --accent-tlc-soft: #ecfeff;
      --accent-hyb: #047857;
      --accent-hyb-soft: #ecfdf5;
      --accent-purple: #6b21a8;
      --accent-purple-soft: #faf5ff;

      /* shape & motion */
      --radius-sm: 6px;
      --radius: 10px;
      --radius-lg: 14px;
      --shadow-1: 0 1px 2px rgba(15,20,25,.04);
      --shadow-2: 0 1px 2px rgba(15,20,25,.04), 0 4px 12px rgba(15,20,25,.04);
      --shadow-3: 0 4px 24px rgba(15,20,25,.06), 0 1px 2px rgba(15,20,25,.04);
      --ease: cubic-bezier(.22,.61,.36,1);
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px; line-height: 1.5; color: var(--text); background: var(--bg);
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      letter-spacing: -0.005em;
    }

    /* ---------- App chrome ---------- */
    .app-bar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 14px 28px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10; backdrop-filter: saturate(180%) blur(8px);
    }
    .app-bar .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .app-bar .brand .mark {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), #7d8aff);
      display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px;
      box-shadow: 0 2px 8px rgba(94,106,210,.3);
    }
    .app-bar .crumbs { font-size: 13px; color: var(--text-muted); }
    .app-bar .crumbs strong { color: var(--text); font-weight: 500; }
    .app-bar .user { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
    .app-bar .avatar {
      width: 26px; height: 26px; border-radius: 50%; background: #ddd6fe; color: #5b21b6;
      display: grid; place-items: center; font-weight: 600; font-size: 11px;
    }

    .shell { max-width: 880px; margin: 32px auto; padding: 0 24px; }

    .page-h {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 8px;
    }
    .page-h h1 {
      font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin: 0;
    }
    .page-h .meta { font-size: 13px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .page-sub { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }

    .demo-tag {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 10.5px; font-weight: 500; padding: 2px 7px; border-radius: 3px;
      background: var(--surface-3); color: var(--text-muted);
      letter-spacing: 0.02em; text-transform: uppercase;
    }
    .demo-tag::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--text-muted); }

    /* ---------- Sections ---------- */
    .stack { display: flex; flex-direction: column; gap: 12px; }

    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: box-shadow .25s var(--ease), border-color .25s var(--ease), opacity .25s var(--ease);
      overflow: hidden;
    }
    .section.is-active {
      box-shadow: var(--shadow-3);
      border-color: var(--border-strong);
    }
    .section.is-pending { opacity: .55; }
    .section.is-pending .section-body { display: none; }

    .section-head {
      display: grid; grid-template-columns: 32px 1fr auto; gap: 14px;
      align-items: center; padding: 18px 22px;
      cursor: default;
    }
    .section.is-complete:not(.is-active) .section-head { cursor: pointer; }
    .section.is-complete:not(.is-active) .section-head:hover { background: var(--surface-2); }

    .step-num {
      width: 28px; height: 28px; border-radius: 8px;
      background: var(--surface-3); color: var(--text-muted);
      display: grid; place-items: center; font-weight: 600; font-size: 13px;
      transition: all .2s var(--ease);
    }
    .section.is-active .step-num {
      background: var(--primary); color: #fff;
      box-shadow: 0 2px 8px rgba(94,106,210,.3);
    }
    .section.is-complete .step-num {
      background: var(--success-soft); color: var(--success);
    }
    .section.is-complete .step-num::before { content: '✓'; }
    .section.is-complete .step-num .n { display: none; }

    .step-title {
      display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    }
    .step-title h3 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
    .step-title .step-sub { font-size: 13px; color: var(--text-muted); font-weight: 400; }

    .summary-chip {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--surface-3); padding: 5px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 500; color: var(--text-soft);
      max-width: 100%;
    }

    .edit-link {
      font-size: 13px; color: var(--primary); cursor: pointer;
      font-weight: 500; padding: 4px 10px; border-radius: 6px;
      transition: background .15s var(--ease);
      user-select: none;
    }
    .edit-link:hover { background: var(--primary-soft); }

    .section-body {
      padding: 4px 22px 22px;
      animation: revealIn .25s var(--ease);
    }
    @keyframes revealIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }

    /* ---------- Form atoms ---------- */
    label.field-label {
      display: block; font-size: 12px; font-weight: 500; margin-bottom: 6px;
      color: var(--text-muted);
    }
    input, select, textarea {
      width: 100%; padding: 10px 12px;
      border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      font: inherit; background: var(--surface); color: var(--text);
      transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(94,106,210,.3);
    }
    input::placeholder { color: var(--text-faint); }

    button.btn {
      padding: 10px 16px; border: 0; border-radius: var(--radius-sm); cursor: pointer;
      font: inherit; font-weight: 500; font-size: 14px;
      transition: background .15s var(--ease), box-shadow .15s var(--ease), transform .05s;
    }
    button.btn:active { transform: translateY(1px); }
    button.btn.primary { background: var(--primary); color: #fff; box-shadow: 0 1px 2px rgba(15,20,25,.08); }
    button.btn.primary:hover { background: var(--primary-hover); }
    button.btn.ghost { background: transparent; color: var(--text-soft); border: 1px solid var(--border-strong); }
    button.btn.ghost:hover { background: var(--surface-2); }
    button.btn.subtle { background: var(--surface-3); color: var(--text-soft); }
    button.btn.subtle:hover { background: var(--border); }
    button.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    /* Tertiary text link — for de-emphasized secondary actions */
    button.text-link {
      background: none; border: 0; padding: 8px 4px;
      color: var(--primary); cursor: pointer; font: inherit;
      font-size: 13px; font-weight: 500; border-radius: 4px;
      text-decoration: underline; text-decoration-thickness: 1px;
      text-underline-offset: 3px; transition: color .15s var(--ease);
    }
    button.text-link:hover { color: var(--primary-hover); }
    button.text-link:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(94,106,210,.3); }

    /* ---------- Pills (location, etc) ---------- */
    .pills { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill {
      padding: 8px 14px; background: var(--surface); color: var(--text-soft);
      border: 1px solid var(--border-strong); border-radius: 999px;
      cursor: pointer; font-size: 13px; font-weight: 500;
      transition: all .15s var(--ease); user-select: none;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .pill:hover { border-color: var(--primary); color: var(--text); }
    .pill.active {
      background: var(--primary); color: #fff; border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(94,106,210,.25);
    }
    .pill .count { font-size: 11px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
    .pill.active .count { color: rgba(255,255,255,.8); }
    .pill:disabled, .pill.disabled { opacity: .35; cursor: not-allowed; }

    /* ---------- Customer search ---------- */
    .toolbar { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: end; }

    .result-list {
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      max-height: 360px; overflow: auto; margin-top: 12px; background: var(--surface);
    }
    .result-row {
      padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer;
      transition: background .12s var(--ease);
      display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center;
    }
    .result-row:last-child { border-bottom: 0; }
    .result-row:hover { background: var(--primary-tint); }
    .result-row.selected { background: var(--primary-soft); }
    .result-row.disabled { opacity: .55; cursor: not-allowed; }
    .result-row.disabled:hover { background: transparent; }
    .result-row .name { font-weight: 600; font-size: 14px; color: var(--text); }
    .result-row .meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.45; }

    /* ---------- Badges ---------- */
    .badge {
      display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 600;
      padding: 2px 7px; border-radius: 4px; letter-spacing: 0.01em; text-transform: uppercase;
    }
    .badge.b-eligible  { background: var(--success-soft); color: var(--success); }
    .badge.b-pending   { background: var(--warn-soft);    color: var(--warn); }
    .badge.b-rejected  { background: var(--danger-soft);  color: var(--danger); }
    .badge.b-broker    { background: var(--primary-soft); color: var(--primary); }
    .badge.b-accident  { background: var(--accent-purple-soft); color: var(--accent-purple); }
    .badge.b-tlc       { background: var(--accent-tlc-soft); color: var(--accent-tlc); }
    .badge.b-hybrid    { background: var(--accent-hyb-soft); color: var(--accent-hyb); }
    .badge.b-inprog    { background: var(--warn-soft);    color: var(--warn); }
    .badge.b-qd        { background: #fff7ed;             color: #c2410c; }

    /* ---------- Deal type ---------- */
    .deal-types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .deal-type-card {
      padding: 16px 16px; background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: var(--radius); cursor: pointer; transition: all .15s var(--ease);
      position: relative;
    }
    .deal-type-card:hover { border-color: var(--primary); }
    .deal-type-card.active {
      border-color: var(--primary); background: var(--primary-tint);
      box-shadow: 0 2px 8px rgba(94,106,210,.12);
    }
    .deal-type-card.disabled { opacity: .35; cursor: not-allowed; }
    .deal-type-card .name { font-size: 15px; font-weight: 600; color: var(--text); }
    .deal-type-card .desc { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .deal-type-card .check { position: absolute; top: 12px; right: 12px; width: 16px; height: 16px;
      border: 1.5px solid var(--border-strong); border-radius: 50%; background: var(--surface);
      transition: all .15s var(--ease); }
    .deal-type-card.active .check { border-color: var(--primary); background: var(--primary); }
    .deal-type-card.active .check::after {
      content: ''; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%); width: 6px; height: 6px; border-radius: 50%; background: #fff;
    }

    /* ---------- Vehicle table ---------- */
    .vtable-wrap {
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      max-height: 480px; overflow: auto; background: var(--surface); margin-top: 12px;
      box-shadow: var(--shadow-1);
    }
    .vtable { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; }
    .vtable thead th {
      background: var(--surface-2); text-align: left; padding: 10px 12px;
      font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 1; white-space: nowrap;
      font-size: 11px; letter-spacing: 0.02em; text-transform: uppercase;
    }
    .vtable tbody td {
      padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: middle;
      font-variant-numeric: tabular-nums;
    }
    .vtable tbody tr { cursor: pointer; transition: background .12s var(--ease); }
    .vtable tbody tr:hover { background: var(--primary-tint); }
    .vtable tbody tr.selected { background: var(--primary-soft); }
    .vtable tbody tr.disabled { opacity: .5; cursor: not-allowed; }
    .vtable tbody tr.disabled:hover { background: transparent; }
    .vtable tbody tr:last-child td { border-bottom: 0; }
    .vtable .price { font-weight: 600; color: var(--text); }
    .vtable .bucket-type { font-weight: 500; color: var(--text); }
    .vtable .empty { color: var(--text-muted); text-align: center; padding: 32px 12px !important; }

    /* ---------- Submit area ---------- */
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; }

    .summary-block {
      padding: 14px; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); margin-bottom: 16px;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
    }
    .summary-block .field-label { margin-bottom: 2px; }
    .summary-block .value { font-size: 13.5px; font-weight: 500; color: var(--text); }
    .summary-block .sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

    .defaults-note {
      padding: 12px 14px; background: var(--primary-tint); border: 1px solid #d4d9f5;
      border-radius: var(--radius-sm); font-size: 12.5px; color: var(--text-soft);
      margin-top: 16px; line-height: 1.6;
    }
    .defaults-note code {
      font-family: var(--mono); font-size: 11px; background: var(--surface);
      padding: 1px 6px; border-radius: 3px; color: var(--text);
    }

    /* Inline action bar at the bottom of the active section */
    .form-actions {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-top: 24px; padding-top: 18px;
      border-top: 1px solid var(--border);
    }
    .form-actions .help { color: var(--text-muted); font-size: 12.5px; }

    /* Toggle switch */
    .toggle { position: relative; display: inline-block; width: 36px; height: 20px; vertical-align: middle; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider {
      position: absolute; cursor: pointer; inset: 0;
      background: var(--border-strong); transition: background .2s var(--ease);
      border-radius: 20px;
    }
    .toggle .slider::before {
      position: absolute; content: ''; height: 14px; width: 14px;
      left: 3px; bottom: 3px; background: #fff; border-radius: 50%;
      transition: transform .2s var(--ease);
      box-shadow: 0 1px 2px rgba(15,20,25,.18);
    }
    .toggle input:checked + .slider { background: var(--primary); }
    .toggle input:checked + .slider::before { transform: translateX(16px); }

    /* Pre-populated from NetSuite badge */
    .ns-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 4px;
      background: var(--primary-soft); color: var(--primary); margin-left: 8px;
    }
    .ns-badge::before { content: '⟲'; font-size: 11px; }

    /* Swap-specific inputs */
    .swap-inputs {
      margin-top: 18px; padding: 14px 16px;
      background: var(--accent-purple-soft); border: 1px solid #d8b4fe;
      border-radius: var(--radius);
    }
    .swap-inputs .swap-h { font-size: 12px; font-weight: 600; color: var(--accent-purple);
      text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px; }

    /* Customer details panel (after pick) */
    .customer-detail {
      margin-top: 12px; padding: 14px 16px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    }
    .customer-detail .field-label { margin-bottom: 2px; }
    .customer-detail .value { font-size: 13.5px; font-weight: 500; color: var(--text); }

    /* Inline label for toggle row */
    .row-toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .row-toggle .label-block { flex: 1; }
    .row-toggle .label-block .field-label { margin-bottom: 2px; }
    .row-toggle .label-block .helper { font-size: 12px; color: var(--text-muted); }

    .success-block {
      padding: 16px 18px; background: var(--success-soft); border: 1px solid #abefc6;
      border-radius: var(--radius); color: var(--success);
    }
    .success-block .title { font-weight: 600; font-size: 14.5px; }
    .success-block .sub { font-size: 12.5px; margin-top: 4px; color: #15724e; }

    .payload-pre {
      background: #0c1018; color: #d6dbe6; padding: 14px 16px; border-radius: var(--radius-sm);
      font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; max-height: 320px;
      overflow: auto; margin-top: 12px; line-height: 1.55;
    }

    /* ---------- Lifecycle timeline ---------- */
    .timeline {
      display: flex; align-items: flex-start; gap: 0;
      margin: 4px 0 22px; padding: 6px 0;
    }
    .tstep { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 88px; }
    .tstep .dot {
      position: relative; width: 28px; height: 28px; border-radius: 50%;
      background: var(--surface); color: var(--text-faint);
      border: 1.5px solid var(--border-strong);
      display: grid; place-items: center; font-weight: 600; font-size: 12px;
      transition: all .25s var(--ease);
      font-variant-numeric: tabular-nums;
    }
    .tstep.complete .dot { background: var(--success); border-color: var(--success); color: #fff; }
    .tstep.complete .dot .n { display: none; }
    .tstep.complete .dot::before { content: '✓'; font-size: 14px; }
    .tstep.current .dot {
      background: var(--primary); border-color: var(--primary); color: #fff;
      box-shadow: 0 0 0 4px rgba(94,106,210,.16);
    }
    .tstep.current .dot::after {
      content: ''; position: absolute; inset: -4px; border-radius: 50%;
      background: var(--primary); opacity: .25;
      animation: pulse 1.6s ease-in-out infinite;
    }
    .tstep.rejected .dot { background: var(--danger); border-color: var(--danger); color: #fff; }
    .tstep.rejected .dot::before { content: '✕'; font-size: 14px; }
    .tstep.rejected .dot .n { display: none; }
    .tstep .lbl { font-size: 11.5px; font-weight: 500; color: var(--text-muted); text-align: center; max-width: 92px; }
    .tstep.current .lbl, .tstep.complete .lbl { color: var(--text); font-weight: 600; }
    .tline { flex: 1; height: 2px; background: var(--border); margin: 13px 4px 0; transition: background .3s var(--ease); border-radius: 2px; min-width: 12px; }
    .tline.complete { background: var(--success); }
    @keyframes pulse {
      0%, 100% { opacity: .25; transform: scale(1); }
      50%      { opacity: 0;   transform: scale(1.6); }
    }

    /* ---------- Stage panels ---------- */
    .stage-panel {
      padding: 16px 18px; border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface); margin-bottom: 14px;
    }
    .stage-panel.is-pending { background: var(--primary-tint); border-color: #d4d9f5; }
    .stage-panel.is-success { background: var(--success-soft); border-color: #abefc6; }
    .stage-panel.is-warn { background: var(--warn-soft); border-color: #fde68a; }
    .stage-panel .title { font-weight: 600; font-size: 14.5px; display: flex; gap: 10px; align-items: center; }
    .stage-panel .sub { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; }
    .stage-panel.is-success .sub { color: #15724e; }
    .stage-panel.is-pending .sub { color: #3b3f6b; }

    /* ---------- Parallel task cards ---------- */
    .tasks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .task-card {
      border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 16px; background: var(--surface);
      display: flex; flex-direction: column; gap: 12px;
    }
    .task-card.done { border-color: #abefc6; background: var(--success-soft); }
    .task-card.in-progress { border-color: var(--primary); background: var(--primary-tint); }

    .task-title { font-size: 13.5px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
    .task-status {
      font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600;
      padding: 2px 7px; border-radius: 4px; background: var(--surface-3); color: var(--text-muted);
    }
    .task-status.active { background: var(--primary-soft); color: var(--primary); }
    .task-status.done   { background: #d1fadf;             color: var(--success); }
    .task-body { color: var(--text-soft); font-size: 13px; }

    /* ---------- Radio cards ---------- */
    .radio-group { display: flex; flex-direction: column; gap: 8px; }
    .radio-card {
      padding: 12px 14px; border: 1.5px solid var(--border-strong); border-radius: var(--radius-sm);
      cursor: pointer; transition: all .15s var(--ease);
      display: flex; gap: 10px; align-items: flex-start; background: var(--surface);
    }
    .radio-card:hover { border-color: var(--primary); }
    .radio-card.active { border-color: var(--primary); background: var(--primary-tint); }
    .radio-card .radio {
      width: 16px; height: 16px; border: 1.5px solid var(--border-strong); border-radius: 50%;
      margin-top: 2px; position: relative; flex-shrink: 0; background: var(--surface);
    }
    .radio-card.active .radio { border-color: var(--primary); }
    .radio-card.active .radio::after {
      content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 8px; height: 8px; border-radius: 50%; background: var(--primary);
    }
    .radio-card .rl { flex: 1; }
    .radio-card .rl-label { font-size: 13.5px; font-weight: 600; color: var(--text); }
    .radio-card .rl-desc  { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* ---------- Mock payment portal ---------- */
    .pos-card {
      border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 16px;
      background: linear-gradient(180deg, #fff, #fbfbfd); margin-top: 10px;
    }
    .pos-card .pos-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .pos-card .pos-title { font-weight: 600; font-size: 13.5px; }
    .pos-card .grid-2 { gap: 10px; }
    .pos-card input { padding: 8px 10px; font-size: 13px; }
    .pos-card .pos-pay { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .pos-card .pos-amount { font-size: 18px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }

    .sms-card {
      border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 18px 16px;
      background: var(--surface); margin-top: 10px; text-align: center;
    }

      background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-size: 22px;
    }
    .sms-card .phone-num { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--text); margin: 4px 0 6px; }

    .demo-controls {
      margin-top: 14px; padding: 10px 14px; border-radius: var(--radius-sm);
      background: var(--accent-purple-soft); border: 1px dashed #d8b4fe;
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    }
    .demo-controls .lbl { font-size: 11px; font-weight: 600; color: var(--accent-purple); text-transform: uppercase; letter-spacing: 0.04em; margin-right: 4px; }

    /* ---------- Helpers ---------- */
    .row-flex { display: flex; align-items: center; gap: 8px; }
    .spacer { flex: 1; }
    .text-muted { color: var(--text-muted); }
    .text-faint { color: var(--text-faint); font-size: 12px; }
    .nowrap { white-space: nowrap; }
    .mt-12 { margin-top: 12px; }
    .mt-16 { margin-top: 16px; }
    .mt-24 { margin-top: 24px; }

    /* ---------- Accessibility: respect reduced-motion preference ---------- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ---------- Accessibility: visible focus rings on all interactive surfaces ---------- */
    button.btn:focus-visible,
    .pill:focus-visible,
    .qd-loc-pill:focus-visible,
    .deal-type-card:focus-visible,
    .radio-card:focus-visible,
    .result-row:focus-visible,
    .vtable tbody tr:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(94,106,210,.3);
    }
    .deal-type-card:focus-visible,
    .radio-card:focus-visible {
      border-color: var(--primary);
    }

    /* ===================================================================== *
     *  Responsive — tablet (≤768px) and phone (≤480px)
     * ===================================================================== */
    @media (max-width: 768px) {
      .shell { margin: 16px auto 24px; padding: 0 12px; }
      .app-bar { padding: 12px 16px; }
      .app-bar .crumbs { display: none; }
      .app-bar .user .username { display: none; }
      .page-h h1 { font-size: 22px; }
      .page-sub { font-size: 13px; }

      .section-head { padding: 14px 16px; gap: 10px; }
      .section-body { padding: 4px 16px 16px; }
      .step-title { flex-direction: column; align-items: flex-start; gap: 2px; }
      .summary-chip { max-width: calc(100vw - 130px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      .grid-3 { grid-template-columns: 1fr 1fr; gap: 10px; }
      .grid-4 { grid-template-columns: 1fr 1fr; gap: 10px; }
      .summary-block { grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
      .customer-detail { grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 14px; }
      .deal-types { grid-template-columns: 1fr 1fr; }
      .qd-channel-grid { grid-template-columns: 1fr 1fr; }

      .toolbar { grid-template-columns: 1fr; gap: 10px; }
      .toolbar > div:nth-child(2),
      .toolbar > div:nth-child(3) { width: auto; }

      .form-actions { flex-direction: column; align-items: stretch; gap: 10px; }
      .form-actions .help { order: 2; text-align: center; }
      .form-actions .row-flex { width: 100%; justify-content: space-between; gap: 8px; }
      .form-actions .row-flex .btn { flex: 1; }

      /* Vehicle table — already scrolls horizontally; tighten font */
      .vtable thead th { font-size: 10px; padding: 8px 8px; }
      .vtable tbody td { padding: 9px 8px; font-size: 11px; }

      /* Lifecycle timeline — let it scroll if it overflows */
      .timeline { overflow-x: auto; padding-bottom: 6px; }
      .tstep { min-width: 70px; }
      .tstep .lbl { font-size: 10.5px; max-width: 70px; }

      /* Active deal banner: shrink large grids */
      .swap-inputs { padding: 12px 14px; }
      .swap-inputs .swap-h { font-size: 11px; }

      .stage-panel { padding: 14px; }
      .stage-panel .title { font-size: 14px; }

      .tasks { grid-template-columns: 1fr; gap: 10px; }
      .pos-card .pos-pay { flex-direction: column; align-items: stretch; gap: 10px; }
      .pos-card .pos-pay .btn { width: 100%; }
    }

    @media (max-width: 480px) {
      .shell { margin: 12px auto 24px; padding: 0 10px; }
      .qd-card, .section { border-radius: 8px; }
      .section-head { padding: 12px 14px; }
      .section-body { padding: 4px 14px 14px; }
      .page-h h1 { font-size: 20px; }
      .demo-tag { font-size: 10px; }

      /* Single-column for everything */
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; gap: 10px; }
      .summary-block { grid-template-columns: 1fr; gap: 10px; }
      .customer-detail { grid-template-columns: 1fr; gap: 10px; }
      .deal-types { grid-template-columns: 1fr; }
      .qd-channel-grid { grid-template-columns: 1fr; }

      /* Pills */
      .pills, .qd-loc-pills { gap: 6px; }
      .pill, .qd-loc-pill { padding: 7px 12px; font-size: 12px; }

      /* Buttons full-width in form actions */
      .form-actions .row-flex .btn { font-size: 13px; padding: 10px 12px; }

      .summary-chip { max-width: calc(100vw - 110px); }
    }

    async searchCustomers({ q='', limit=40, eligibleOnly=true }) {
      await sleep(120);
      const term = q.trim().toLowerCase();
      return CUSTOMERS.filter(c => {
        if (eligibleOnly && !ELIGIBLE_UW.has(c.uw)) return false;
        if (!term) return true;
        return [c.first, c.last, c.dl, c.phone, c.email].some(f => f && f.toLowerCase().includes(term));
      }).slice(0, limit);
    },
    async availableDealTypesForLocation(locationId) {
      await sleep(50);
      return DEAL_TYPES
        .map(p => ({ ...p, subtypes: p.subtypes.filter(s => s.locations.includes(locationId)) }))
        .filter(p => p.subtypes.length > 0);
    },
    async searchOfferings({ subtypeId, location, q='' }) {
      await sleep(160);
      const term = q.trim().toLowerCase();
      return OFFERINGS.filter(o => {
        if (subtypeId && o.salesChannel !== subtypeId) return false;
        if (location && o.location !== location) return false;
        if (term && ![o.shortVin, o.vin, o.plate, o.brand, o.model, o.bucketType].some(f => String(f).toLowerCase().includes(term))) return false;
        return true;
      });
    },
    async createDeal(p) {
      await sleep(280);
      const channel = DEAL_TYPES.flatMap(d => d.subtypes).find(s => s.id === p.subtypeId);
      const offering = OFFERINGS.find(o => o.id === p.offeringId);
      const customer = CUSTOMERS.find(c => c.id === p.customerId);
      const stockNo = `${(channel.id || 'QD').replace(/[^A-Z0-9]/g,'').substring(0,5)}-${Date.now().toString().slice(-6)}`;
      return {
        id: 'STK-'+Math.floor(Math.random()*900000+100000),
        stockNo,
        fields: {
          'custrecord_advs_lm_lc_stock_no':           stockNo,
          'custrecord_advs_lm_lc_vin':                offering.id,

  // ---- Icon helper (Lucide-style line icons replacing emoji-as-icons)
  // Every icon in this prototype is paired with a visible text label, so they are
  // decorative for screen-readers (aria-hidden). If a future icon needs to convey
  // standalone meaning, add aria-label inline at the use site.
  function Icon({ name, size = 16, style = {} }) {
    const wrap = (paths) => h`<svg aria-hidden="true" focusable="false" width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style=${{display:'inline-block',verticalAlign:'middle',flexShrink:0,...style}}>${paths}</svg>`;
    switch (name) {
      case 'document': return wrap(h`<${React.Fragment}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></>`);
      case 'card':     return wrap(h`<${React.Fragment}><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></>`);
      case 'phone':    return wrap(h`<${React.Fragment}><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></>`);
      case 'truck':    return wrap(h`<${React.Fragment}><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></>`);
      case 'bolt':     return wrap(h`<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>`);
      case 'warning':  return wrap(h`<${React.Fragment}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>`);
      case 'clock':    return wrap(h`<${React.Fragment}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>`);
      case 'check':    return wrap(h`<polyline points="20 6 9 17 4 12"/>`);
      case 'x':        return wrap(h`<${React.Fragment}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>`);
      default: return null;
    }
  }

  function uwBadgeKind(uw) {
    if (ELIGIBLE_UW.has(uw)) return 'b-eligible';
    if (uw === 'Rejected') return 'b-rejected';
    if (uw === 'Submitted to Broker') return 'b-broker';
    if (uw && uw.toLowerCase().startsWith('accident')) return 'b-accident';
    return 'b-pending';
  }

  function Section({ n, title, sub, state, summary, onEdit, children }) {
    // state: 'pending' | 'active' | 'complete'
    const cls = 'section ' + (state === 'active' ? 'is-active' : (state === 'complete' ? 'is-complete' : 'is-pending'));
    const showSummary = state === 'complete';
    return h`<section class=${cls}>
      <div class="section-head" onClick=${() => state === 'complete' && onEdit && onEdit()}>
        <div class="step-num"><span class="n">${n}</span></div>
        <div class="step-title">
          <h3>${title}</h3>
          ${!showSummary && sub && h`<span class="step-sub">${sub}</span>`}
          ${showSummary && summary && h`<span class="summary-chip">${summary}</span>`}
        </div>
        ${showSummary && h`<div class="edit-link">Edit</div>`}
      </div>
      ${state === 'active' && h`<div class="section-body">${children}</div>`}
    </section>`;
  }

            <div class="field-label" style=${{marginBottom:8}}>Is this a swap?</div>

              <button class="btn primary" onClick=${() => setSwap(s => ({...s, decision: 'yes'}))}>Yes — swap this deal</button>
              <button class="text-link"   onClick=${() => setSwap({decision: 'no', reason: '', confirmed: true})}>or start a new deal instead</button>
            </div>`}
            ${swap.decision === 'yes' && h`<div>
              <div style=${{marginBottom:6, color:'var(--success)', fontSize:12, fontWeight:600}}>✓ Swap selected</div>
              <label class="field-label">Return reason *</label>
              <textarea rows="2" value=${swap.reason ?? ''}
                        onChange=${e => setSwap(s => ({...s, reason: e.target.value}))}

              <div class="row-flex" style=${{marginTop:10, justifyContent:'space-between'}}>
                <button class="btn ghost" onClick=${() => setSwap({decision: null, reason: '', confirmed: false})}>Change to new deal instead</button>

    return h`<div>
      <div class="toolbar">
        <div>
          <label class="field-label">Search by name, license, phone, or email</label>

        <div>
          <label class="field-label">&nbsp;</label>
          <button class=${'btn ' + (eligibleOnly ? 'primary' : 'ghost')} onClick=${() => setEligibleOnly(!eligibleOnly)}>
            ${eligibleOnly ? 'Eligible only' : 'All customers'}
          </button>

        <div>

  /* ---- Section 6: Submit (inline action row at the bottom) ---- */
  function SubmitSection({ customer, location, subtype, offering, terms, isSwap, swap, submitData, setSubmitData, result, submitting, onSubmit, onDiscard }) {
    const overrides = submitData.overrides;
    const comment   = submitData.comment;
    const setComment = v => setSubmitData(d => ({ ...d, comment: v }));
    function set(field, value) { setSubmitData(d => ({ ...d, overrides: { ...d.overrides, [field]: value } })); }

    if (result) {
      return h`<${LifecycleView} result=${result} customer=${customer} offering=${offering} subtype=${subtype} />`;
    }

    const fmtDate = d => d ? new Date(d + 'T00:00').toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) : '—';
    const surchargeLabel = terms.insuranceSurchargeEnabled ? `$${terms.insuranceSurchargeAmount || 0}/period` : 'None';

        <div class="row-flex" style=${{flexWrap:'wrap', gap:14, fontSize:13}}>

      <div class="summary-block">

        <div><div class="field-label">Vehicle</div><div class="value">${offering.year} ${offering.brand} ${offering.model}</div><div class="sub">${offering.bucketType}</div></div>

        <div><div class="field-label">Subsidiary</div><div class="value">${offering.subsidiary}</div></div>

        <div><div class="field-label">Insurance surcharge</div><div class="value">${surchargeLabel}</div></div>
        <div><div class="field-label">${terms.frequency || offering.calcFreq} pmt · deposit</div><div class="value">${terms.deposit ? `$${Number(terms.deposit).toLocaleString()}` : '—'}</div></div>
      </div>

      <label class="field-label">Pricing overrides — package defaults shown as placeholders</label>
      <div class="grid-2">
        <div>
          <label class="field-label">Regular payment ($/${(terms.frequency || offering.calcFreq).toLowerCase()})</label>

            onInput=${e => set('regularPayment', e.target.value === '' ? undefined : Number(e.target.value))} />

        <div>
          <label class="field-label">Cash down ($)</label>
          <input type="number" placeholder=${offering.cashDown}
            value=${overrides.cashDown ?? ''}
            onInput=${e => set('cashDown', e.target.value === '' ? undefined : Number(e.target.value))} />

      </div>

      <div class="defaults-note">
        <strong>Auto-filled from package:</strong>
        # of payments <code>${offering.noOfPayments}</code>,
        retail <code>$${offering.retailPrice.toLocaleString()}</code>,
        partner <code>${offering.partner}</code>,
        hybrid <code>${offering.hybrid ? 'Yes' : 'No'}</code>,
        passtime <code>${offering.passtime ? 'Yes' : 'No'}</code>,
        customer <code>${customer.customerId || '(create on save)'}</code>,
        deal status <code>Manager Approval</code>.
      </div>

      <div class="mt-16">
        <label class="field-label">Note to approver (optional)</label>
        <textarea rows="2" value=${comment ?? ''} onChange=${e => setComment(e.target.value)} placeholder="e.g. customer requesting expedited start"></textarea>
      </div>

      <div class="form-actions">
        <span class="help">Once submitted, the manager will review and you'll see the deal lifecycle below.</span>
        <div class="row-flex">
          <button class="btn ghost" onClick=${onDiscard}>Discard</button>
          <button class="btn primary" disabled=${submitting} onClick=${onSubmit}>
            ${submitting ? 'Submitting…' : 'Submit for manager approval'}
          </button>
        </div>
      </div>
    </div>`;
  }

  /* ---- Lifecycle (post-submit) ---- */
  function Timeline({ stage, rejected }) {
    // stage: 1..5  ('submitted','pending_mgr','approved','contract_payment','active')
    // rejected: bool — pending_mgr step renders red, downstream stays pending
    const steps = [
      { n: 1, label: 'Submitted' },
      { n: 2, label: 'Manager review' },
      { n: 3, label: 'Approved' },
      { n: 4, label: 'Contract & payment' },
      { n: 5, label: 'Active' }
    ];
    return h`<div class="timeline">
      ${steps.map((s, i) => {
        let cls = 'tstep ';
        if (rejected && s.n === 2)         cls += 'rejected';
        else if (rejected && s.n > 2)      cls += '';   // pending
        else if (s.n < stage)              cls += 'complete';
        else if (s.n === stage)            cls += 'current';
        return h`<${React.Fragment} key=${s.n}>
          <div class=${cls}>
            <div class="dot"><span class="n">${s.n}</span></div>
            <div class="lbl">${s.label}</div>
          </div>
          ${i < steps.length - 1 && h`<div class=${'tline ' + (s.n < stage && !(rejected && s.n >= 2) ? 'complete' : '')}></div>`}
        </>`;
      })}
    </div>`;
  }

  function LifecycleView({ result, customer, offering, subtype }) {
    // submission state machine
    const [submitState, setSubmitState] = useState('pending_approval'); // pending_approval | approved | rejected
    const [rejectReason, setRejectReason] = useState('');
    // sub-tasks once approved
    const [contractState, setContractState] = useState('idle');         // idle | sent | signed
    const [paymentState, setPaymentState]   = useState('idle');         // idle | method | collecting | received
    const [paymentMethod, setPaymentMethod] = useState(null);           // 'in_person' | 'remote'
    const [posCard, setPosCard]             = useState({ num:'', exp:'', cvv:'', zip:'' });
    const [showPayload, setShowPayload]     = useState(false);

    // computed top-level stage 1..5
    const allDone = contractState === 'signed' && paymentState === 'received';
    let stage = 1;
    if (submitState === 'pending_approval') stage = 2;
    else if (submitState === 'approved' && !allDone) stage = 4;
    else if (submitState === 'approved' && allDone)  stage = 5;
    const rejected = submitState === 'rejected';

    // pricing
    const total = (offering.regularPayment || 0) + (offering.cashDown || 0);

    // ---- panels ----
    function PendingPanel() {
      return h`<div class="stage-panel is-pending">
        <div class="title"><${Icon} name="clock" size=${16} style=${{marginRight:6}} /> Pending manager approval</div>
        <div class="sub">Submitted to <strong>Wisleidis Cruz</strong> · usually responds in &lt;30 min · deal status set to <code>Manager Approval</code></div>
        <div class="demo-controls">
          <span class="lbl">Demo</span>
          <button class="btn primary" onClick=${() => setSubmitState('approved')}>Approve as manager</button>
          <button class="btn ghost" onClick=${() => setSubmitState('rejected')}>Reject as manager</button>
        </div>
      </div>`;
    }

    function RejectedPanel() {
      return h`<div class="stage-panel is-warn">
        <div class="title"><${Icon} name="x" size=${16} style=${{marginRight:6}} /> Deal rejected by manager</div>
        <div class="sub">Reason: <em>${rejectReason || 'Pricing outside policy — please review and resubmit'}</em></div>
        <div class="demo-controls">
          <span class="lbl">Demo</span>
          <button class="btn ghost" onClick=${() => { setSubmitState('pending_approval'); }}>Resubmit</button>
        </div>
      </div>`;
    }

    function ContractCard() {
      const cls = 'task-card ' + (contractState === 'signed' ? 'done' : (contractState === 'sent' ? 'in-progress' : ''));
      return h`<div class=${cls}>
        <div class="task-head">
          <div class="task-title"><${Icon} name="document" size=${16} /> Contract</div>
          <div class=${'task-status ' + (contractState === 'signed' ? 'done' : contractState === 'sent' ? 'active' : '')}>
            ${contractState === 'idle' ? 'Not sent' : contractState === 'sent' ? 'Awaiting signature' : 'Signed'}
          </div>
        </div>
        <div class="task-body">
          ${contractState === 'idle' && h`<span>Send contract to <strong>${customer.email}</strong> via Adobe Sign for e-signature.</span>`}
          ${contractState === 'sent' && h`<span>Contract sent — customer will receive an email and can sign on any device.</span>`}
          ${contractState === 'signed' && h`<span>Contract signed by ${customer.first} ${customer.last} · all parties countersigned.</span>`}
        </div>
        <div>
          ${contractState === 'idle' && h`<button class="btn primary" onClick=${() => setContractState('sent')}>Send for e-signature</button>`}
          ${contractState === 'sent' && h`<div class="demo-controls" style=${{margin:0}}>
            <span class="lbl">Demo</span>
            <button class="btn subtle" onClick=${() => setContractState('signed')}>Mark as signed</button>
          </div>`}
        </div>
      </div>`;
    }

    function PaymentCard() {
      const cls = 'task-card ' + (paymentState === 'received' ? 'done' : (paymentState === 'idle' ? '' : 'in-progress'));
      return h`<div class=${cls}>
        <div class="task-head">
          <div class="task-title"><${Icon} name="card" size=${16} /> Customer payment</div>
          <div class=${'task-status ' + (paymentState === 'received' ? 'done' : paymentState !== 'idle' ? 'active' : '')}>
            ${paymentState === 'idle' ? 'Not started' : paymentState === 'method' ? 'Choose method' : paymentState === 'collecting' ? (paymentMethod === 'in_person' ? 'Collecting at counter' : 'Awaiting customer') : 'Received'}
          </div>
        </div>
        <div class="task-body">
          ${paymentState === 'idle' && h`<span>Collect <strong>$${total.toLocaleString()}</strong> (${offering.calcFreq.toLowerCase()} payment + cash down) before delivery.</span>`}

          ${paymentState === 'method' && h`<div class="radio-group">
            <div class=${'radio-card ' + (paymentMethod === 'in_person' ? 'active' : '')}
                 onClick=${() => setPaymentMethod('in_person')}>
              <div class="radio"></div>
              <div class="rl">
                <div class="rl-label">Take payment in person</div>
                <div class="rl-desc">Open the agent POS portal and enter the customer's card here at the counter.</div>
              </div>
            </div>
            <div class=${'radio-card ' + (paymentMethod === 'remote' ? 'active' : '')}
                 onClick=${() => setPaymentMethod('remote')}>
              <div class="radio"></div>
              <div class="rl">
                <div class="rl-label">Send link to customer's phone</div>
                <div class="rl-desc">Customer receives an SMS with a secure payment link · completes from their phone.</div>
              </div>
            </div>
          </div>`}

          ${paymentState === 'collecting' && paymentMethod === 'in_person' && h`<div class="pos-card">
            <div class="pos-h">
              <div class="pos-title">Agent POS</div>
              <span class="task-status active">Live</span>
            </div>
            <label class="field-label">Card number</label>
            <input value=${posCard.num} onInput=${e => setPosCard({...posCard, num:e.target.value})} placeholder="•••• •••• •••• 4242" />
            <div class="grid-3" style=${{marginTop:8}}>
              <div><label class="field-label">Expiry</label><input value=${posCard.exp} onInput=${e => setPosCard({...posCard, exp:e.target.value})} placeholder="MM/YY" /></div>
              <div><label class="field-label">CVV</label><input value=${posCard.cvv} onInput=${e => setPosCard({...posCard, cvv:e.target.value})} placeholder="123" /></div>
              <div><label class="field-label">Billing zip</label><input value=${posCard.zip} onInput=${e => setPosCard({...posCard, zip:e.target.value})} placeholder="11101" /></div>
            </div>
            <div class="pos-pay">
              <div><div class="text-faint">Charging</div><div class="pos-amount">$${total.toLocaleString()}</div></div>
              <button class="btn primary" onClick=${() => setPaymentState('received')}>Charge card</button>
            </div>
          </div>`}

          ${paymentState === 'collecting' && paymentMethod === 'remote' && h`<div class="sms-card">
            <div class="phone-icon"><${Icon} name="phone" size=${22} /></div>
            <div>SMS sent to</div>
            <div class="phone-num">${customer.phone}</div>
            <div class="meta">Customer will receive a secure link · completes payment in &lt; 60 seconds typical</div>
            <div class="demo-controls" style=${{justifyContent:'center', marginTop:14}}>
              <span class="lbl">Demo</span>
              <button class="btn subtle" onClick=${() => setPaymentState('received')}>Mark as paid</button>
            </div>
          </div>`}

          ${paymentState === 'received' && h`<span>Payment of <strong>$${total.toLocaleString()}</strong> received via ${paymentMethod === 'in_person' ? 'in-person card' : 'remote payment link'}.</span>`}
        </div>
        ${paymentState === 'idle' && h`<button class="btn primary" onClick=${() => setPaymentState('method')}>Start payment</button>`}
        ${paymentState === 'method' && h`<button class="btn primary" disabled=${!paymentMethod} onClick=${() => setPaymentState('collecting')}>Continue</button>`}
      </div>`;
    }

    function ApprovedPanel() {
      return h`<div>
        <div class="stage-panel is-success">
          <div class="title">✓ Deal confirmed</div>
          <div class="sub">Approved by Wisleidis Cruz · Stock <strong>${result.stockNo}</strong> ready for delivery once contract and payment are complete.</div>
        </div>
        <div class="tasks">
          <${ContractCard} />
          <${PaymentCard} />
        </div>
      </div>`;
    }

    function ActivePanel() {
      return h`<div>
        <div class="stage-panel is-success">
          <div class="title"><${Icon} name="truck" size=${18} style=${{marginRight:6}} /> Deal active</div>
          <div class="sub">Contract signed · payment received · vehicle ${offering.shortVin} ready for handover.</div>
        </div>
        <div class="defaults-note">
          <strong>Final state:</strong> Stock <code>${result.stockNo}</code>,
          deal status <code>Active</code>,
          contract <code>Signed</code>,
          payment <code>Received</code>,
          subsidiary <code>${offering.subsidiary}</code>.
        </div>
        <div class="mt-16" style=${{display:'flex', gap:8}}>
          <button class="btn ghost" onClick=${() => setShowPayload(s => !s)}>${showPayload ? 'Hide' : 'Show'} Stock payload</button>
          <button class="btn primary" onClick=${() => window.location.reload()}>Create another deal</button>
        </div>
        ${showPayload && h`<div class="payload-pre">${JSON.stringify(result.fields, null, 2)}</div>`}
      </div>`;
    }

    return h`<div>
      <${Timeline} stage=${stage} rejected=${rejected} />
      ${submitState === 'pending_approval' && PendingPanel()}
      ${submitState === 'rejected'         && RejectedPanel()}
      ${submitState === 'approved'         && stage < 5 && ApprovedPanel()}
      ${submitState === 'approved'         && stage === 5 && ActivePanel()}
    </div>`;
  }

  /* ---- App ---- */
  function App() {
    const tomorrow = new Date(Date.now()+86400000).toISOString().slice(0,10);

    const [customer, setCustomer] = useState(null);
    const [location, setLocation] = useState(null);
    const [parentType, setParentType] = useState(null);   // 'lease' | 'finance' | 'rental' | 'other'
    const [subtype, setSubtype]       = useState(null);
    const [offering, setOffering]     = useState(null);

    // Swap-mode lives at the customer step now: { decision: null|'yes'|'no', reason: '', confirmed: bool }
    // confirmed gates section 1 advancement so the textarea isn't unmounted mid-keystroke.
    const [swap, setSwap] = useState({ decision: null, reason: '', confirmed: false });
    const isSwap = swap.decision === 'yes' && swap.confirmed;

    // Deal terms
    const [terms, setTerms] = useState({
      insuranceSurchargeEnabled: false,
      insuranceSurchargeAmount: '',
      paymentStartDate: tomorrow,
      deposit: '',
      frequency: 'Weekly',
      confirmed: false
    });
    const [termsMode, setTermsMode] = useState('new');    // 'inherit' | 'new' (only matters in swap)

    // Submit state
    const [submitData, setSubmitData] = useState({ overrides: {}, comment: '' });
    const [submitting, setSubmitting] = useState(false);
    const [result, setResult]         = useState(null);

    // ---- Effects: reset / pre-populate downstream when upstream changes ----

    // Customer change → reset everything below it; pre-populate insurance from customer profile.
    useEffect(() => {
      setLocation(null);
      setParentType(null); setSubtype(null);
      setOffering(null);
      setSwap({ decision: null, reason: '', confirmed: false });
      setTermsMode('new');
      if (customer) {
        setTerms(t => ({
          ...t,
          insuranceSurchargeEnabled: customer.insuranceSurcharge != null,
          insuranceSurchargeAmount:  customer.insuranceSurcharge ?? '',
          deposit: '',
          frequency: 'Weekly',
          confirmed: false
        }));
      }
    }, [customer && customer.id]);

    // Once the swap decision is *confirmed*, default termsMode based on yes/no.
    // (We only react after confirmation so the user can change their mind freely beforehand.)
    useEffect(() => {
      if (!swap.confirmed) return;
      if (swap.decision === 'yes') setTermsMode('inherit');
      if (swap.decision === 'no')  setTermsMode('new');
    }, [swap.confirmed, swap.decision]);

    // When termsMode flips, mutate the form fields accordingly.
    useEffect(() => {
      if (!customer) return;
      if (termsMode === 'inherit' && customer.activeDeal) {
        const ad = customer.activeDeal;
        setTerms(t => ({
          ...t,
          insuranceSurchargeEnabled: ad.insuranceSurcharge != null,
          insuranceSurchargeAmount:  ad.insuranceSurcharge ?? '',
          deposit:                   ad.deposit ?? '',
          frequency:                 ad.frequency || 'Weekly',
          confirmed: false
        }));
      } else if (termsMode === 'new') {
        setTerms(t => ({
          ...t,
          insuranceSurchargeEnabled: customer.insuranceSurcharge != null,
          insuranceSurchargeAmount:  customer.insuranceSurcharge ?? '',
          deposit: '',
          frequency: 'Weekly',
          confirmed: false
        }));
      }
    }, [termsMode, customer && customer.id]);

    useEffect(() => { setParentType(null); setSubtype(null); }, [location]);
    useEffect(() => { setSubtype(null); }, [parentType]);
    useEffect(() => { setTerms(t => ({ ...t, confirmed: false })); }, [subtype && subtype.id]);
    useEffect(() => { setOffering(null); }, [subtype && subtype.id, location]);

    async function handleSubmit() {
      if (!customer || !subtype || !offering || !terms.confirmed) return;
      setSubmitting(true);
      const r = await api.createDeal({
        customerId: customer.id, subtypeId: subtype.id, offeringId: offering.id,
        startDate: terms.paymentStartDate,
        overrides: { ...submitData.overrides,
          insuranceSurcharge: terms.insuranceSurchargeEnabled ? Number(terms.insuranceSurchargeAmount) || 0 : 0,
          deposit:            terms.deposit !== '' ? Number(terms.deposit) : 0,
          frequency:          terms.frequency,
          isSwap:             isSwap,
          swapOf:             isSwap && customer.activeDeal ? customer.activeDeal.stockNo : null,
          swapReason:         isSwap ? swap.reason : null
        },
        comment: submitData.comment
      });
      setResult(r); setSubmitting(false);
    }

    // Section 1 is "complete" only when swap decision is explicitly confirmed
    // (if customer has an active deal). Otherwise the section auto-completes on customer pick.
    const customerSectionDone = !!customer && (
      !(customer.activeDeal && customer.activeDeal.stockNo) ||
      swap.confirmed
    );

    let active = 1;
    if (!customerSectionDone) active = 1;
    else if (!location) active = 2;
    else if (!subtype) active = 3;
    else if (!terms.confirmed) active = 4;
    else if (!offering) active = 5;
    else active = 6;

    function stateFor(stepN) {
      if (stepN === active) return 'active';
      if (stepN < active) return 'complete';
      return 'pending';
    }

    function pickSubtype(parentId, subId) {
      setParentType(parentId);
      if (subId) {
        const p = DEAL_TYPES.find(x => x.id === parentId);
        const s = p.subtypes.find(x => x.id === subId);
        setSubtype(s);
      } else {
        setSubtype(null);
      }
    }

    // ---- Render ----
    const customerChip = customer && h`<span>
      <strong>${customer.first} ${customer.last}</strong> · ${customer.dl}
      <span class=${'badge ' + uwBadgeKind(customer.uw)} style=${{marginLeft:4}}>${customer.uw}</span>
      ${swap.decision === 'yes' && customer.activeDeal && h`<span class="qd-pill" style=${{marginLeft:6, background:'var(--accent-purple-soft)', color:'var(--accent-purple)'}}>Swap of #${customer.activeDeal.stockNo}</span>`}
      ${swap.decision === 'no'  && customer.activeDeal && h`<span class="qd-pill" style=${{marginLeft:6}}>New deal · existing #${customer.activeDeal.stockNo} stays</span>`}
    </span>`;

    return h`<div>
      <div class="app-bar">
        <div class="brand">
          <div class="mark">QD</div>
          QuickDeal
        </div>
        <div class="crumbs">Sales · <strong>New deal</strong></div>
        <div class="user">
          <div class="avatar">YM</div>
          <span class="username">Yordy Martinez</span>
        </div>
      </div>

      <div class="shell">
        <div class="page-h">
          <h1>New deal</h1>
          <span class="demo-tag">Prototype · v3.11</span>
        </div>
        <div class="page-sub">Synthetic data shaped after Tower's real distributions. Submit shows the JSON payload — nothing leaves this page.</div>

        <div class="stack">
          <${Section} n=${1} title="Customer"
            sub="Pick an eligible pre-lead or existing customer"
            state=${stateFor(1)}
            summary=${customerSectionDone && customerChip}
            onEdit=${() => setCustomer(null)}>
            <${CustomerSection}
              value=${customer}
              onPick=${setCustomer}
              swap=${swap} setSwap=${setSwap}
              onClear=${() => setCustomer(null)} />
          </>

          <${Section} n=${2} title="Location"
            sub="Where is the deal being created"
            state=${stateFor(2)}
            summary=${location && h`<strong>${LOCATIONS.find(l => l.id === location)?.label}</strong>`}
            onEdit=${() => setLocation(null)}>
            <${LocationSection} value=${location} onPick=${setLocation} />
          </>

          <${Section} n=${3} title="Deal type"
            sub="Category and sub-type — only those available at this location"
            state=${stateFor(3)}
            summary=${subtype && h`<strong>${subtype.name}</strong> · ${subtype.desc}`}
            onEdit=${() => { setSubtype(null); setParentType(null); }}>
            <${DealTypeSection}
              location=${location}
              value=${parentType}
              subValue=${subtype && subtype.id}
              onPick=${pickSubtype} />
          </>

          <${Section} n=${4} title="Deal terms"
            sub="Insurance surcharge, payment start, deposit / frequency"
            state=${stateFor(4)}
            summary=${terms.confirmed && h`<span><strong>Start ${new Date(terms.paymentStartDate+'T00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</strong>${terms.insuranceSurchargeEnabled ? ` · surcharge $${terms.insuranceSurchargeAmount || 0}` : ''}${terms.deposit ? ` · deposit $${Number(terms.deposit).toLocaleString()}` : ''}${terms.frequency !== 'Weekly' ? ` · ${terms.frequency}` : ''}${isSwap ? ` · ${termsMode === 'inherit' ? 'inherited' : 'new terms'}` : ''}</span>`}
            onEdit=${() => setTerms(t => ({ ...t, confirmed: false }))}>
            <${DealTermsSection}
              customer=${customer} subtype=${subtype}
              terms=${terms} setTerms=${setTerms}
              isSwap=${isSwap} termsMode=${termsMode} setTermsMode=${setTermsMode}
              onConfirm=${() => setTerms(t => ({ ...t, confirmed: true }))} />
          </>

          <${Section} n=${5} title="Vehicle"
            sub="Available offerings filtered by your selections"
            state=${stateFor(5)}
            summary=${offering && h`<strong>${offering.year} ${offering.brand} ${offering.model}</strong> · ${offering.bucketType} · $${offering.regularPayment.toLocaleString()}/${offering.calcFreq.toLowerCase()}`}
            onEdit=${() => setOffering(null)}>
            <${VehicleSection}
              subtypeId=${subtype && subtype.id}
              location=${location} value=${offering} onPick=${setOffering} />
          </>

          <${Section} n=${6} title="Review & submit"
            sub="Confirm details and send to manager"
            state=${stateFor(6)}
            summary=${null}>
            <${SubmitSection}
              customer=${customer} location=${location} subtype=${subtype} offering=${offering}
              terms=${terms}
              isSwap=${isSwap} swap=${swap}
              submitData=${submitData} setSubmitData=${setSubmitData}
              result=${result} submitting=${submitting}
              onSubmit=${handleSubmit}
              onDiscard=${() => window.location.reload()} />
          </>
        </div>
      </div>
    </div>`;
  }

  ReactDOM.createRoot(document.getElementById('qd-root')).render(h`<${App} />`);
  </script>
</body>
</html>
